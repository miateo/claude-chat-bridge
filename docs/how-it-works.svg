<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How chat-bridge works</title>
  <desc id="d">A Claude chat in the desktop app calls the chat-bridge connector, which writes the message to a private folder. The chat-bridge mod in a listening Claude Code session picks it up, runs it as a prompt after your approval of its actions, and the answer travels back the same way.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b93a7"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="16" fill="#12141c"/>
  <text x="40" y="48" fill="#f2f4f8" font-size="20" font-weight="600">How chat-bridge works</text>
  <text x="40" y="72" fill="#8b93a7" font-size="13">Everything stays on your computer. Only the chat can start an exchange.</text>

  <!-- chat -->
  <rect x="40" y="130" width="200" height="140" rx="12" fill="#1b1f2b" stroke="#2c3244"/>
  <text x="140" y="164" fill="#f2f4f8" font-size="15" font-weight="600" text-anchor="middle">Claude chat</text>
  <text x="140" y="184" fill="#8b93a7" font-size="12" text-anchor="middle">desktop app</text>
  <rect x="60" y="204" width="160" height="44" rx="8" fill="#252b3b"/>
  <text x="140" y="223" fill="#c9cfdd" font-size="12" text-anchor="middle">"ask the ads session</text>
  <text x="140" y="239" fill="#c9cfdd" font-size="12" text-anchor="middle">which ads exist"</text>

  <!-- connector -->
  <rect x="320" y="130" width="200" height="140" rx="12" fill="#1b1f2b" stroke="#2c3244"/>
  <text x="420" y="164" fill="#f2f4f8" font-size="15" font-weight="600" text-anchor="middle">Connector</text>
  <text x="420" y="184" fill="#8b93a7" font-size="12" text-anchor="middle">local MCP server</text>
  <rect x="340" y="204" width="160" height="44" rx="8" fill="#252b3b"/>
  <text x="420" y="223" fill="#c9cfdd" font-size="12" text-anchor="middle">~/.claude/chat-bridge</text>
  <text x="420" y="239" fill="#8b93a7" font-size="11" text-anchor="middle">private folder + audit log</text>

  <!-- sessions -->
  <rect x="600" y="100" width="320" height="200" rx="12" fill="#1b1f2b" stroke="#2c3244"/>
  <text x="760" y="132" fill="#f2f4f8" font-size="15" font-weight="600" text-anchor="middle">Claude Code sessions</text>
  <text x="760" y="152" fill="#8b93a7" font-size="12" text-anchor="middle">each with the chat-bridge mod listening</text>
  <rect x="620" y="170" width="280" height="48" rx="8" fill="#252b3b" stroke="#d97757"/>
  <circle cx="642" cy="194" r="5" fill="#57c98a"/>
  <text x="658" y="190" fill="#f2f4f8" font-size="13" font-weight="600">ads</text>
  <text x="658" y="207" fill="#8b93a7" font-size="11">runs the message, asks you before actions</text>
  <rect x="620" y="230" width="280" height="48" rx="8" fill="#252b3b"/>
  <circle cx="642" cy="254" r="5" fill="#57c98a"/>
  <text x="658" y="250" fill="#f2f4f8" font-size="13" font-weight="600">website</text>
  <text x="658" y="267" fill="#8b93a7" font-size="11">listening, not addressed</text>

  <!-- arrows -->
  <path d="M240 185 H318" stroke="#8b93a7" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M320 225 H242" stroke="#8b93a7" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="280" y="177" fill="#d97757" font-size="11" text-anchor="middle">message</text>
  <text x="280" y="243" fill="#57c98a" font-size="11" text-anchor="middle">answer</text>

  <path d="M520 185 H598" stroke="#8b93a7" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M600 225 H522" stroke="#8b93a7" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="560" y="177" fill="#d97757" font-size="11" text-anchor="middle">to "ads"</text>
  <text x="560" y="243" fill="#57c98a" font-size="11" text-anchor="middle">answer</text>

  <!-- footer -->
  <rect x="40" y="330" width="880" height="40" rx="10" fill="#1b1f2b" stroke="#2c3244"/>
  <text x="480" y="355" fill="#c9cfdd" font-size="13" text-anchor="middle">While a relayed message runs, every action that is not a read waits for your approval in Claude Code.</text>
</svg>
